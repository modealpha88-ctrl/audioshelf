name: Test M4B chapter detection

on:
  push:
    paths:
      - 'app/src/main/java/com/mohamed/audioshelf/data/source/M4bChapterParser.kt'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/test-m4b-chapters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
