name: Validate audiobook providers

on:
  workflow_dispatch:
  push:
    paths:
      - 'sources/**'
      - 'scripts/validate_audiobook_catalogs.py'
      - '.github/workflows/validate-audiobook-sources.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source manifest and chapter links
        run: python scripts/validate_audiobook_catalogs.py
