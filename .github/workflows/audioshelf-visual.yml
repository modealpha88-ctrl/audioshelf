name: AudioShelf visual verification
on: [push]
jobs:
  screen-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -cores 2 -memory 1536 -no-snapshot -noaudio -no-boot-anim
          script: python3 verification/shelf-fixtures.py && python3 verification/visual-shelf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AudioShelf-visual-verification
          path: |
            /tmp/audioshelf-screenshots
            app/build/reports/tests/testDebugUnitTest
