name: Publish Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.2.0
        required: true
        default: v0.5.0
  push:
    paths:
      - '.github/release-request.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Run Android unit tests before publishing
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Resolve and verify release version
        id: release_version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="$(tr -d '\r\n' < .github/release-request.txt)"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          app_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test "$version" = "v$app_version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.AUDIOSHELF_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_B64"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > app/release.keystore
      - name: Build signed release APK
        env:
          AUDIOSHELF_KEYSTORE_PATH: release.keystore
          AUDIOSHELF_STORE_PASSWORD: ${{ secrets.AUDIOSHELF_RELEASE_STORE_PASSWORD }}
          AUDIOSHELF_KEY_ALIAS: audioshelf
          AUDIOSHELF_KEY_PASSWORD: ${{ secrets.AUDIOSHELF_RELEASE_STORE_PASSWORD }}
        run: gradle :app:assembleRelease
      - name: Verify installable APK signature, release certificate, and 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          bt="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose --print-certs --min-sdk-version 26 "$apk" > /tmp/signature-report.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature-report.txt
          # Prevent an accidental key change that would strand existing installations.
          expected_cert="ee1540d83c0fb7c0d0826351bd7f127d72ffb53a199b698caee1685b55430637"
          grep -Fq "V2 Signer: certificate SHA-256 digest: $expected_cert" /tmp/signature-report.txt
          "$bt/zipalign" -c -P 16 4 "$apk"
          "$bt/aapt" dump badging "$apk" > /tmp/apk-badging.txt
          grep -Fq "package: name='com.mohamed.audioshelf'" /tmp/apk-badging.txt
          release_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          grep -Fq "versionName='$release_name'" /tmp/apk-badging.txt
          echo "APK signature valid (v2), release signer unchanged, 16 KB aligned, package identity and version verified."
      - name: Verify Vosk/JNA native libraries in signed release APK
        run: python3 scripts/verify_vosk_apk.py app/build/outputs/apk/release/app-release.apk
      - name: Verify native BitTorrent engine in release APK
        run: python3 scripts/verify_torrent_apk.py app/build/outputs/apk/release/app-release.apk
      - name: Verify and name APK
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "AudioShelf-${RELEASE_VERSION}.apk"
          sha256sum "AudioShelf-${RELEASE_VERSION}.apk" > "AudioShelf-${RELEASE_VERSION}.apk.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}
        run: |
          gh release create "$RELEASE_VERSION" \
            "AudioShelf-${RELEASE_VERSION}.apk" \
            "AudioShelf-${RELEASE_VERSION}.apk.sha256" \
            --title "AudioShelf ${RELEASE_VERSION}" \
            --generate-notes \
            --target "$GITHUB_SHA"
