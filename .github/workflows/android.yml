name: Build Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: gradle :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Vosk/JNA native libraries in debug APK
        run: python3 scripts/verify_vosk_apk.py app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AudioShelf-debug
          path: app/build/outputs/apk/debug/app-debug.apk
